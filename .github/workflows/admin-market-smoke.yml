name: Verify administrator latest market

on:
  workflow_dispatch:
    inputs:
      qa_email:
        description: 'Optional pre-provisioned disposable housing-refactor-qa account'
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify administrator report without sending email
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HOUSING_QA_EMAIL: ${{ inputs.qa_email }}
          HOUSING_ADMIN_EMAIL: ${{ secrets.HOUSING_ADMIN_EMAIL }}
        run: python3 scripts/check_admin_market.py
